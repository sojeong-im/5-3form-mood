<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 무드해방일지</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        #login-screen {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        #login-screen input {
            padding: 10px;
            width: 80%;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        #login-screen button {
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 80%;
        }
        #login-screen button:hover {
            background: #555;
        }
        #dashboard-screen {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .refresh-btn {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>관리자 로그인</h2>
        <input type="password" id="password-input" placeholder="비밀번호를 입력하세요">
        <button id="login-btn">로그인</button>
    </div>

    <div id="dashboard-screen">
        <div class="header">
            <h2>무드해방일지 신청자 목록</h2>
            <button id="refresh-btn" class="refresh-btn">새로고침 🔄</button>
        </div>
        <p>총 <span id="total-count" style="font-weight: bold; color: #007bff;">0</span>명의 신청자가 있습니다.</p>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>이름/닉네임</th>
                        <th>연락처</th>
                        <th>옷장 상태</th>
                        <th>도전 컬러/패션</th>
                        <th>기대 활동</th>
                        <th>남긴 말</th>
                        <th>신청일시</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- JS에서 렌더링 -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
